<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#5b5fc7">
<title>MD Edit — Markdown 編輯器</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5fa; --surface: #ffffff; --surface2: #ededf4;
    --border: #dddde8; --text: #1a1a2e; --muted: #7777a0;
    --accent: #5b5fc7; --accent-bg: rgba(91,95,199,.08);
    --editor-bg: #ffffff; --preview-bg: #fafafd; --code-bg: #f0f0f6;
    --toolbar-bg: rgba(255,255,255,.92); --shadow: 0 1px 3px rgba(0,0,0,.06);
    --radius: 8px;
  }
  .dark {
    --bg: #0e0e18; --surface: #181828; --surface2: #222236;
    --border: #2a2a42; --text: #dcdce8; --muted: #8080a4;
    --accent: #7b7ff0; --accent-bg: rgba(123,127,240,.1);
    --editor-bg: #111120; --preview-bg: #14142299; --code-bg: #1a1a2c;
    --toolbar-bg: rgba(24,24,40,.94); --shadow: 0 1px 3px rgba(0,0,0,.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
    transition: background .25s, color .25s;
    height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button, summary { touch-action: manipulation; }
  button:focus-visible, summary:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  /* ── Header ── */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px; border-bottom: 1px solid var(--border);
    background: var(--toolbar-bg); backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px); z-index: 10;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-mark { font-size: 20px; font-weight: 700; letter-spacing: -.5px; }
  .logo-mark span { color: var(--accent); }
  .stats {
    font-size: 11px; color: var(--muted); background: var(--surface2);
    padding: 3px 10px; border-radius: 20px; white-space: nowrap;
  }
  .header-right { display: flex; align-items: center; gap: 3px; }

  /* ── Buttons ── */
  .btn {
    padding: 5px 12px; border: none; border-radius: 6px; cursor: pointer;
    font-size: 13px; font-weight: 500; font-family: inherit;
    background: transparent; color: var(--muted); transition: all .15s;
  }
  .btn:hover { color: var(--accent); background: var(--accent-bg); }
  .btn.active { background: var(--accent); color: #fff; }
  .btn.active:hover { background: var(--accent); filter: brightness(1.1); }
  .divider { width: 1px; height: 20px; background: var(--border); margin: 0 6px; }

  /* ── Toolbar ── */
  .toolbar {
    display: flex; gap: 1px; padding: 5px 16px; flex-wrap: wrap; align-items: center;
    border-bottom: 1px solid var(--border);
    background: var(--toolbar-bg); backdrop-filter: blur(14px);
  }
  .tool-btn {
    padding: 4px 10px; border: 1px solid transparent; border-radius: 5px;
    cursor: pointer; font-size: 13px; background: transparent;
    color: var(--muted); font-family: 'JetBrains Mono', monospace;
    transition: all .12s; line-height: 1.4;
  }
  .tool-btn:hover {
    background: var(--accent-bg); color: var(--accent);
    border-color: rgba(91,95,199,.2);
  }
  .tool-btn.toggle-on {
    background: var(--accent); color: #fff;
    border-color: var(--accent);
  }
  .tool-btn.toggle-on:hover { filter: brightness(1.1); }
  .tool-spacer { flex: 1; }
  .export-btn {
    padding: 4px 10px; border: none; border-radius: 5px; cursor: pointer;
    font-size: 12px; background: transparent; color: var(--muted);
    font-family: inherit; transition: color .15s; white-space: nowrap;
  }
  .export-btn:hover { color: var(--accent); }

  /* File controls stay available in both edit and preview views. */
  .document-bar {
    display: flex; align-items: center; gap: 12px; padding: 8px 16px;
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .document-info { flex: 1; min-width: 0; }
  .filename {
    display: block; width: 100%; max-width: 360px; padding: 3px 0;
    background: transparent; color: var(--text); border: none; border-radius: 4px;
    font-size: 14px; font-weight: 500; font-family: inherit; text-overflow: ellipsis;
  }
  .draft-status { color: var(--muted); font-size: 11px; line-height: 1.5; }
  .file-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .file-actions .export-primary { background: var(--accent); color: #fff; }
  .file-actions .export-primary:hover { filter: brightness(1.1); }
  .more-menu { position: relative; }
  .more-menu summary { list-style: none; cursor: pointer; white-space: nowrap; }
  .more-menu summary::-webkit-details-marker { display: none; }
  .more-actions {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 30;
    min-width: 180px; padding: 6px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--surface); box-shadow: 0 6px 24px rgba(0,0,0,.12);
  }
  .more-actions button { display: block; text-align: left; width: 100%; }
  .more-actions p { padding: 8px; color: var(--muted); font-size: 12px; line-height: 1.6; }
  body[data-view="preview"] .toolbar, body[data-view="notes"] .toolbar { display: none; }

  /* ── Search/Replace bar ── */
  .search-bar {
    display: none; padding: 6px 16px; gap: 6px; align-items: center; flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    background: var(--toolbar-bg); backdrop-filter: blur(14px);
    font-size: 13px;
  }
  .search-bar.show { display: flex; }
  .search-bar input[type="text"] {
    padding: 5px 10px; border: 1px solid var(--border); border-radius: 5px;
    font-size: 13px; font-family: 'JetBrains Mono', monospace;
    background: var(--editor-bg); color: var(--text); outline: none;
    width: 220px; transition: border-color .15s;
  }
  .search-bar input[type="text"]:focus { border-color: var(--accent); }
  .search-bar input[type="text"]::placeholder { color: var(--muted); }
  .search-bar .s-btn {
    padding: 4px 10px; border: 1px solid var(--border); border-radius: 5px;
    cursor: pointer; font-size: 12px; font-family: inherit;
    background: transparent; color: var(--muted); transition: all .15s;
  }
  .search-bar .s-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-bg); }
  .search-bar .s-info { font-size: 11px; color: var(--muted); min-width: 60px; }
  .search-bar .s-close {
    padding: 4px 8px; border: none; border-radius: 5px; cursor: pointer;
    font-size: 15px; background: transparent; color: var(--muted);
    transition: color .15s; margin-left: auto;
  }
  .search-bar .s-close:hover { color: var(--accent); }
  .search-bar .s-toggle {
    padding: 3px 7px; border: 1px solid var(--border); border-radius: 4px;
    cursor: pointer; font-size: 11px; font-family: 'JetBrains Mono', monospace;
    background: transparent; color: var(--muted); transition: all .15s;
  }
  .search-bar .s-toggle.on {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  .search-bar .s-toggle:hover:not(.on) { border-color: var(--accent); color: var(--accent); }
  .search-bar .s-row { display: flex; align-items: center; gap: 6px; width: 100%; }
  .search-bar .s-row:nth-child(2) { margin-top: 2px; }
  .search-bar .s-row.s-hidden { display: none; }

  /* ── Search highlight in preview ── */
  .preview-pane mark.search-hl {
    background: rgba(255, 213, 0, .4); color: inherit;
    border-radius: 2px; padding: 0 1px;
  }
  .preview-pane mark.search-hl-active {
    background: rgba(255, 140, 0, .6);
  }

  /* ── Main area ── */
  .main { flex: 1; min-height: 0; display: flex; overflow: hidden; }

  /* ── Editor ── */
  .editor-pane {
    flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column;
    border-right: 1px solid var(--border);
  }
  .editor-pane.full { border-right: none; }
  #editor {
    flex: 1; min-height: 0; width: 100%; resize: none; border: none; outline: none;
    padding: 20px 24px; font-size: 14px; line-height: 1.75; tab-size: 2;
    font-family: 'JetBrains Mono', 'Noto Sans TC', monospace;
    background: var(--editor-bg); color: var(--text);
    caret-color: var(--accent);
  }
  #editor::placeholder { color: var(--muted); }

  /* ── Preview ── */
  .preview-pane {
    flex: 1; min-width: 0; overflow: auto; padding: 20px 32px;
    background: var(--preview-bg); font-size: 15px; line-height: 1.8;
    overflow-wrap: anywhere;
  }
  body[data-view="preview"] .preview-pane, body[data-view="notes"] .preview-pane { padding: 24px max(32px, calc((100% - 800px) / 2)); }
  .preview-pane > :first-child { margin-top: 0; }
  .preview-pane .table-scroll { overflow-x: auto; margin: 12px 0; }
  .preview-pane .table-scroll table { margin: 0; }
  /* Lifelog grouping is a preview layout; source text stays in file order. */
  .lifelog-summary { color: var(--muted); font-size: .82em; margin-bottom: 18px; }
  .lifelog-day { border: 1px solid var(--border); border-radius: 12px; margin: 0 0 18px; overflow: hidden; }
  .preview-pane .lifelog-day-title {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px;
    font-size: 1.08em; margin: 0; padding: 12px 16px; background: var(--accent-bg);
  }
  .lifelog-day-count { color: var(--muted); font-size: .75em; font-weight: 400; margin-left: auto; }
  .preview-pane .lifelog-entries { list-style: none; padding: 0; margin: 0; }
  .preview-pane .lifelog-entry {
    display: grid; grid-template-columns: 5em minmax(0, 1fr); gap: 12px;
    padding: 14px 16px; margin: 0; border-top: 1px solid var(--border);
  }
  .lifelog-entry-time { color: var(--accent); font-size: .86em; font-variant-numeric: tabular-nums; }
  .lifelog-entry-time.unknown { color: var(--muted); font-size: .75em; }
  .lifelog-entry-body { min-width: 0; }
  .lifelog-entry-body > :first-child { margin-top: 0; }
  .lifelog-entry-body > :last-child { margin-bottom: 0; }
  .lifelog-recorded { color: var(--muted); font-size: .75em; margin-top: 6px; }
  .preview-pane h1 {
    font-size: 1.85em; font-weight: 700; margin: 24px 0 12px;
    padding-bottom: 8px; border-bottom: 2px solid rgba(91,95,199,.25);
    letter-spacing: -.5px;
  }
  .preview-pane h2 { font-size: 1.45em; font-weight: 700; margin: 20px 0 10px; color: var(--accent); }
  .preview-pane h3 { font-size: 1.2em; font-weight: 600; margin: 16px 0 8px; }
  .preview-pane h4 { font-size: 1.08em; font-weight: 600; margin: 14px 0 6px; }
  .preview-pane p { margin: 8px 0; }
  .preview-pane ul, .preview-pane ol { padding-left: 24px; margin: 8px 0; }
  .preview-pane li { margin: 4px 0; }
  .preview-pane a {
    color: var(--accent); text-decoration: none;
    border-bottom: 1px solid rgba(91,95,199,.3);
    transition: border-color .2s;
  }
  .preview-pane a:hover { border-bottom-color: var(--accent); }
  .preview-pane blockquote {
    border-left: 4px solid var(--accent); margin: 12px 0; padding: 8px 16px;
    background: var(--accent-bg); border-radius: 0 8px 8px 0; color: var(--muted);
  }
  .preview-pane pre {
    background: var(--code-bg); padding: 16px 20px; border-radius: 10px;
    overflow-x: auto; margin: 12px 0; font-family: 'JetBrains Mono', monospace;
    font-size: 13px; line-height: 1.6; border: 1px solid var(--border);
    white-space: pre;
  }
  .preview-pane pre code {
    background: none; padding: 0; border: none; font-size: inherit;
  }
  .preview-pane :not(pre) > code {
    background: var(--code-bg); padding: 2px 7px; border-radius: 5px;
    font-family: 'JetBrains Mono', monospace; font-size: .88em;
    border: 1px solid var(--border);
  }
  .preview-pane table { border-collapse: collapse; width: 100%; margin: 12px 0; }
  .preview-pane th {
    background: var(--accent-bg); font-weight: 600; text-align: left;
    padding: 10px 14px; border: 1px solid var(--border); color: var(--accent);
  }
  .preview-pane td { padding: 8px 14px; border: 1px solid var(--border); }
  .preview-pane tr:hover td { background: var(--accent-bg); }
  .preview-pane hr { border: none; height: 2px; background: var(--border); margin: 24px 0; }
  .preview-pane del { color: var(--muted); }
  .preview-pane .task { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .preview-pane .task input { accent-color: var(--accent); width: 16px; height: 16px; }
  .preview-pane img { max-width: 100%; border-radius: 6px; border: 1px solid var(--border); margin: 8px 0; }

  /* ── Mermaid ── */
  .preview-pane .mermaid-rendered {
    margin: 16px 0; text-align: center;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; overflow-x: auto;
  }
  .preview-pane .mermaid-rendered svg { max-width: 100%; height: auto; }
  .preview-pane .mermaid-error {
    margin: 12px 0; padding: 10px 16px; border-radius: 8px;
    background: rgba(220,50,50,.08); color: #c33; font-size: 13px;
    border: 1px solid rgba(220,50,50,.2);
  }

  .hidden { display: none !important; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  /* ── Drop overlay ── */
  .drop-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(91,95,199,.12); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; opacity: 0; transition: opacity .2s;
  }
  .drop-overlay.show { opacity: 1; }
  .drop-overlay div {
    padding: 24px 40px; border-radius: 16px;
    background: var(--surface); border: 2px dashed var(--accent);
    font-size: 18px; font-weight: 600; color: var(--accent);
    box-shadow: 0 8px 32px rgba(0,0,0,.12);
  }

  @media (max-width: 700px) {
    .header { padding: 6px 12px; gap: 4px 8px; flex-shrink: 0; flex-wrap: wrap; }
    .logo-mark { font-size: 16px; white-space: nowrap; }
    .logo-mark span { display: none; }
    .stats { display: none; }
    .header-right { gap: 2px; flex-shrink: 0; margin-left: auto; }
    .header-right .divider, [data-view="split"] { display: none; }
    .btn { min-height: 44px; padding: 8px; font-size: 14px; white-space: nowrap; }
    #themeBtn { min-width: 44px; }
    .document-bar { padding: 8px 12px; flex-wrap: wrap; gap: 6px; flex-shrink: 0; }
    .document-info { flex-basis: 100%; }
    .filename { max-width: none; font-size: 16px; }
    .draft-status { font-size: 12px; }
    .file-actions { width: 100%; gap: 4px; }
    .file-actions > .export-btn { flex: 1; }
    .export-btn, .more-menu summary { min-height: 44px; padding: 10px 8px; font-size: 13px; }
    .more-menu summary { display: flex; align-items: center; }
    .more-actions { min-width: 210px; }
    .toolbar { flex-wrap: nowrap; overflow-x: auto; padding: 2px 8px; flex-shrink: 0; }
    .tool-btn { flex-shrink: 0; min-width: 44px; min-height: 44px; padding: 8px; }
    .toolbar .divider { flex-shrink: 0; }
    .preview-pane { padding: 18px 16px !important; font-size: 17px; line-height: 1.85; }
    .preview-pane h1 { font-size: 1.55em; }
    .preview-pane h2 { font-size: 1.3em; }
    .preview-pane .lifelog-day-title { font-size: 1.05em; padding: 10px 12px; }
    .preview-pane .lifelog-entry { grid-template-columns: 1fr; gap: 2px; padding: 12px; }
    .preview-pane pre { padding: 12px; font-size: 13px; }
    .preview-pane th, .preview-pane td { min-width: 100px; padding: 8px 10px; }
    #editor { padding: 16px; font-size: 16px; line-height: 1.8; }
    .search-bar { padding: 6px 12px; flex-shrink: 0; max-height: 40dvh; overflow-y: auto; }
    .search-bar .s-row { flex-wrap: wrap; gap: 4px; }
    .search-bar input[type="text"] { flex: 1 1 100%; min-width: 0; width: 100%; font-size: 16px; min-height: 44px; }
    .search-bar .s-btn, .search-bar .s-toggle, .search-bar .s-close { min-width: 44px; min-height: 44px; font-size: 13px; }
    .search-bar .s-info { flex: 1; min-width: 42px; }
    .drop-overlay div { padding: 20px; font-size: 16px; }
  }
</style>
</head>
<body>

<!-- Drop overlay -->
<div class="drop-overlay" id="dropOverlay"><div>📄 放開以載入 .md 檔案</div></div>

<!-- Header -->
<div class="header">
  <div class="logo">
    <div class="logo-mark"><span>⬢</span> MD Edit</div>
    <div class="stats" id="stats">0 字元 · 0 詞 · 0 行</div>
  </div>
  <div class="header-right">
    <button class="btn" data-view="edit" onclick="setView('edit')" aria-pressed="false">✎ 編輯</button>
    <button class="btn active" data-view="split" onclick="setView('split')" aria-pressed="true">◫ 分割</button>
    <button class="btn" data-view="preview" onclick="setView('preview')" aria-pressed="false">◉ 預覽</button>
    <button class="btn" data-view="notes" onclick="setView('notes')" aria-pressed="false">▤ 筆記</button>
    <div class="divider"></div>
    <button class="btn" id="themeBtn" onclick="toggleTheme()" title="切換深色/淺色" aria-label="切換深色或淺色模式">🌙</button>
  </div>
</div>

<!-- Document and file controls -->
<div class="document-bar">
  <div class="document-info">
    <input class="filename" id="filenameInput" value="document.md" aria-label="匯出檔名" title="可修改匯出檔名" autocomplete="off" spellcheck="false">
    <div class="draft-status" id="draftStatus" role="status" aria-live="polite"></div>
  </div>
  <div class="file-actions">
    <button class="export-btn" onclick="openFile()">📂 開啟</button>
    <button class="export-btn export-primary" id="saveBtn" onclick="saveBack()">⬇ 匯出 .md</button>
    <button class="export-btn" onclick="toggleSearch(false)" aria-label="搜尋內容">⌕ 搜尋</button>
    <details class="more-menu" id="moreMenu">
      <summary class="export-btn">更多 ▾</summary>
      <div class="more-actions">
        <button class="export-btn" onclick="newFile()">📄 新增文件</button>
        <button class="export-btn" onclick="toggleSearch(true); closeMore()">搜尋與取代</button>
        <button class="export-btn" onclick="downloadMd(); closeMore()">匯出副本 .md</button>
        <button class="export-btn" onclick="downloadHtml(); closeMore()">匯出 .html</button>
        <button class="export-btn" onclick="copyHtml(); closeMore()">複製 HTML</button>
        <p id="saveHint">草稿只保存在此瀏覽器。匯出會下載副本，原始檔案需自行替換。</p>
      </div>
    </details>
  </div>
</div>

<!-- Formatting toolbar -->
<div class="toolbar" id="toolbar">
  <button class="tool-btn" onclick="ins('# ','')">H₁</button>
  <button class="tool-btn" onclick="ins('## ','')">H₂</button>
  <button class="tool-btn" onclick="ins('### ','')">H₃</button>
  <button class="tool-btn" style="font-weight:800" onclick="ins('**','**')">B</button>
  <button class="tool-btn" style="font-style:italic" onclick="ins('*','*')">I</button>
  <button class="tool-btn" style="text-decoration:line-through" onclick="ins('~~','~~')">S</button>
  <button class="tool-btn" onclick="ins('`','`')">&lt;/&gt;</button>
  <button class="tool-btn" onclick="ins('[','](url)')">🔗</button>
  <button class="tool-btn" onclick="ins('- ','')">☰</button>
  <button class="tool-btn" onclick="ins('> ','')">❝</button>
  <button class="tool-btn" onclick="ins('\n---\n','')">—</button>
  <div class="divider"></div>
  <button class="tool-btn" id="noOlBtn" onclick="toggleNoOl()" title="停用數字列表解析（專利模式）">1.⃠</button>
  <input type="file" id="fileInput" accept=".md,.markdown,.txt" hidden>
  <input type="file" id="verifyInput" accept=".md,.markdown,.txt" hidden>
</div>

<!-- Search/Replace bar -->
<div class="search-bar" id="searchBar">
  <div class="s-row">
    <input type="text" id="searchInput" placeholder="搜尋…" aria-label="搜尋文字" autocomplete="off" spellcheck="false">
    <button class="s-toggle" id="sCaseBtn" onclick="toggleCase()" onmousedown="event.preventDefault()" title="區分大小寫">Aa</button>
    <button class="s-toggle" id="sRegexBtn" onclick="toggleRegex()" onmousedown="event.preventDefault()" title="正規表示式">.*</button>
    <span class="s-info" id="searchInfo"></span>
    <button class="s-btn" onclick="searchPrev()" onmousedown="event.preventDefault()" aria-label="上一筆搜尋結果">▲</button>
    <button class="s-btn" onclick="searchNext()" onmousedown="event.preventDefault()" aria-label="下一筆搜尋結果">▼</button>
    <button class="s-close" onclick="closeSearch()" aria-label="關閉搜尋">✕</button>
  </div>
  <div class="s-row" id="replaceRow">
    <input type="text" id="replaceInput" placeholder="取代…" aria-label="取代文字" autocomplete="off" spellcheck="false">
    <button class="s-btn" onclick="replaceCurrent()" onmousedown="event.preventDefault()">取代</button>
    <button class="s-btn" onclick="replaceAll()" onmousedown="event.preventDefault()">全部取代</button>
  </div>
</div>

<!-- Main -->
<div class="main" id="main">
  <div class="editor-pane" id="editorPane">
    <textarea id="editor" aria-label="Markdown 內容" placeholder="在這裡輸入 Markdown..." spellcheck="false"></textarea>
  </div>
  <div class="preview-pane" id="preview"></div>
</div>

<!-- markdown-it CDN (primary parser) -->
<script src="https://cdn.jsdelivr.net/npm/markdown-it/dist/markdown-it.min.js"></script>
<!-- mermaid CDN (flowcharts, sequence diagrams, etc.) -->
<script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>

<script>
// ── Parser setup ──
let md = null;
let noOl = true; // 預設開啟：停用有序列表解析（適合專利文件）

if (window.markdownit) {
  md = window.markdownit({ html: true, breaks: false, linkify: true, typographer: false });
}

// ── Mermaid setup ──
let mermaidReady = false;
if (window.mermaid) {
  mermaid.initialize({
    startOnLoad: false,
    theme: 'default',
    securityLevel: 'loose',
    fontFamily: "'Noto Sans TC', sans-serif",
  });
  mermaidReady = true;
}
let mermaidTimer = null;
const mermaidCache = new Map(); // src → svg string cache

// Preprocess: escape "N." at line start so markdown-it won't create <ol>
function escapeOrderedList(src) {
  return src.replace(/^(\d+)[．.]\s/gm, '$1&#46; ');
}

// Fallback hand-written parser (offline / CDN fail)
function fallbackParseMd(src) {
  let h = src;
  h = h.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
    const esc = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').trimEnd();
    return `<pre data-lang="${lang}"><code>${esc}</code></pre>`;
  });
  h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
  h = h.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img alt="$1" src="$2"/>');
  h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  h = h.replace(/^######\s+(.+)$/gm, '<h6>$1</h6>');
  h = h.replace(/^#####\s+(.+)$/gm, '<h5>$1</h5>');
  h = h.replace(/^####\s+(.+)$/gm, '<h4>$1</h4>');
  h = h.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>');
  h = h.replace(/^##\s+(.+)$/gm, '<h2>$1</h2>');
  h = h.replace(/^#\s+(.+)$/gm, '<h1>$1</h1>');
  h = h.replace(/^---$/gm, '<hr/>');
  h = h.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/\*(.+?)\*/g, '<em>$1</em>');
  h = h.replace(/~~(.+?)~~/g, '<del>$1</del>');
  h = h.replace(/^>\s+(.+)$/gm, '<blockquote>$1</blockquote>');
  h = h.replace(/^[\-\*]\s\[x\]\s+(.+)$/gm, '<div class="task"><input type="checkbox" checked disabled/><span>$1</span></div>');
  h = h.replace(/^[\-\*]\s\[\s?\]\s+(.+)$/gm, '<div class="task"><input type="checkbox" disabled/><span>$1</span></div>');
  h = h.replace(/^[\-\*]\s+(.+)$/gm, '<li>$1</li>');
  h = h.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');
  if (!noOl) {
    h = h.replace(/^\d+\.\s+(.+)$/gm, '<oli>$1</oli>');
    h = h.replace(/((?:<oli>.*<\/oli>\n?)+)/g, m =>
      '<ol>' + m.replace(/<\/?oli>/g, t => t.replace('oli','li')) + '</ol>');
  }
  h = h.replace(/^(\|.+\|)\n(\|[\s\-:|]+\|)\n((?:\|.+\|\n?)+)/gm, (_, hdr, _a, body) => {
    const hc = hdr.split('|').filter(c=>c.trim());
    const rows = body.trim().split('\n');
    let t = '<table><thead><tr>';
    hc.forEach(c => t += `<th>${c.trim()}</th>`);
    t += '</tr></thead><tbody>';
    rows.forEach(r => {
      const cells = r.split('|').filter(c=>c.trim());
      t += '<tr>'; cells.forEach(c => t += `<td>${c.trim()}</td>`); t += '</tr>';
    });
    return t + '</tbody></table>';
  });
  h = h.replace(/^(?!<[a-z/])((?!<).+)$/gm, '<p>$1</p>');
  h = h.replace(/<p>(<(?:h[1-6]|ul|ol|li|blockquote|pre|hr|table|div))/g,'$1');
  h = h.replace(/(<\/(?:h[1-6]|ul|ol|li|blockquote|pre|hr|table|div)>)<\/p>/g,'$1');
  return h;
}

function parseMd(src) {
  if (md) {
    const processed = noOl ? escapeOrderedList(src) : src;
    return md.render(processed);
  }
  return fallbackParseMd(src);
}

// ── Lifelog preview: event date first, recording time on backfilled entries ──
function lifelogDate(code) {
  const year = 2000 + Number(code.slice(0, 2));
  const month = Number(code.slice(2, 4));
  const day = Number(code.slice(4, 6));
  const stamp = Date.UTC(year, month - 1, day);
  const date = new Date(stamp);
  if (date.getUTCFullYear() !== year || date.getUTCMonth() !== month - 1 || date.getUTCDate() !== day) return null;
  return { stamp, iso: `${year}-${code.slice(2, 4)}-${code.slice(4, 6)}` };
}

function lifelogTime(hour, minute) {
  if (Number(hour) > 23 || Number(minute) > 59) return null;
  return `${hour.padStart(2, '0')}:${minute}`;
}

const LIFELOG_ENTRY_RE = /^-\s+(\d{6})[ \t]+(\d{2}):(\d{2})(?:[ \t]+(.*))?$/;

function parseLifelog(src) {
  const lines = src.replace(/\r\n?/g, '\n').split('\n');
  const entries = [];
  let current = null;
  let fence = null;
  for (const line of lines) {
    const match = !fence && line.match(LIFELOG_ENTRY_RE);
    if (match) {
      const written = lifelogDate(match[1]);
      const recordedTime = lifelogTime(match[2], match[3]);
      if (!written || !recordedTime) return null;
      current = { written, recordedTime, event: written, time: recordedTime,
        content: match[4] || '', backfill: false, sequence: entries.length };
      entries.push(current);
      const openingFence = current.content.match(/^ {0,3}(`{3,}|~{3,})/);
      if (openingFence) fence = openingFence[1];
    } else if (current) {
      // The bot indents continuation lines by two spaces. Keep fenced content intact.
      const continuation = line.startsWith('  ') ? line.slice(2) : line;
      current.content += '\n' + continuation;
      const marker = continuation.match(/^ {0,3}(`{3,}|~{3,})(.*)$/);
      if (marker) {
        if (!fence) fence = marker[1];
        else if (marker[1][0] === fence[0] && marker[1].length >= fence.length && !marker[2].trim()) fence = null;
      }
    } else if (line.trim()) {
      return null;
    }
  }
  if (!entries.length) return null;

  entries.forEach(entry => {
    const match = entry.content.match(/^[ \t]*(\d{6})(?:[ \t]+(\d{1,2})[:：](\d{2}))?(?=[ \t]|\n|$)/);
    if (!match) return;
    const event = lifelogDate(match[1]);
    const days = event && (entry.written.stamp - event.stamp) / 86400000;
    // Match the bot's backfill rule: a valid earlier date, within 365 days.
    if (!event || days <= 0 || days > 365) return;
    entry.event = event;
    entry.backfill = true;
    entry.time = match[2] === undefined ? null : lifelogTime(match[2], match[3]);
    // An invalid event time remains part of the content, as it does in the bot.
    const prefixLength = entry.time ? match[0].length : match[0].indexOf(match[1]) + 6;
    entry.content = entry.content.slice(prefixLength).trim();
  });
  entries.sort((a, b) => a.event.stamp - b.event.stamp
    || Number(a.time === null) - Number(b.time === null)
    || (a.time || '').localeCompare(b.time || '') || a.sequence - b.sequence);
  return entries;
}

function renderLifelogPreview(src) {
  const entries = parseLifelog(src);
  if (!entries) return null;
  const days = new Map();
  entries.forEach(entry => {
    const key = entry.event.iso;
    if (!days.has(key)) days.set(key, []);
    days.get(key).push(entry);
  });
  const groups = [...days].map(([date, records]) => {
    const weekday = '日一二三四五六'[new Date(records[0].event.stamp).getUTCDay()];
    const rows = records.map(entry => {
      const time = entry.time === null ? '<span>未填時刻</span>'
        : `<time datetime="${date}T${entry.time}">${entry.time}</time>`;
      const recorded = entry.backfill
        ? `<div class="lifelog-recorded">↳ <time datetime="${entry.written.iso}T${entry.recordedTime}">${entry.written.iso.replace(/-/g, '/')} ${entry.recordedTime}</time> 補記</div>` : '';
      return `<li class="lifelog-entry"><div class="lifelog-entry-time${entry.time === null ? ' unknown' : ''}">${time}</div><div class="lifelog-entry-body">${parseMd(entry.content)}${recorded}</div></li>`;
    }).join('');
    return `<section class="lifelog-day" data-event-date="${date}" aria-label="${date} 的記錄"><h2 class="lifelog-day-title"><time datetime="${date}">${date.replace(/-/g, '/')}（${weekday}）</time><span class="lifelog-day-count">${records.length} 筆</span></h2><ol class="lifelog-entries">${rows}</ol></section>`;
  }).join('');
  return `<div class="lifelog-summary">依發生日期整理 · ${days.size} 天 · ${entries.length} 筆</div>${groups}`;
}

// ── State ──
const editor = document.getElementById('editor');
const preview = document.getElementById('preview');
const editorPane = document.getElementById('editorPane');
const statsEl = document.getElementById('stats');
const filenameInput = document.getElementById('filenameInput');
const draftStatus = document.getElementById('draftStatus');
const mobileLayout = window.matchMedia('(max-width: 700px)');
let currentView = mobileLayout.matches ? 'preview' : 'split';
let isDark = false;
let currentFilename = 'document.md';
let exportedContent = null;
let exportedFilename = null;
let hasUserContent = false;
let draftSaved = false;
let fileLoadGeneration = 0;
// Save-back state. baseContent is the original file's text as last read from or
// written to disk; pendingBase is the last downloaded copy, which the user may
// or may not have put in place of the original. The handle never survives a reload.
const hasFsApi = 'showOpenFilePicker' in window && 'showSaveFilePicker' in window;
const PICKER_TYPES = [{ description: 'Markdown', accept: { 'text/markdown': ['.md', '.markdown'], 'text/plain': ['.txt'] } }];
// Open pickers take no type filter: a file this page has written carries the browser's download
// mark, and the macOS picker greys such a file out under a filter. The name is checked instead.
function isTextFile(name) { return /\.(md|markdown|txt)$/i.test(name); }
let fileHandle = null;
let baseContent = null;
let pendingBase = null;
let boundFilename = null;
let loadedAt = null;
let saving = false;

function normalizeFilename(name) {
  const clean = name.trim().replace(/[\\/:*?"<>|\u0000-\u001f]/g, '-');
  const stem = clean.replace(/\.(md|markdown|txt|html)$/i, '');
  return (stem || 'document') + '.md';
}

function needsExport() {
  return editor.value !== exportedContent || currentFilename !== exportedFilename;
}

function formatLoadedAt(stamp) {
  const d = new Date(stamp);
  const time = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  return d.toDateString() === new Date().toDateString() ? time : `${d.getMonth() + 1}/${d.getDate()} ${time}`;
}

function persistDraft() {
  const draft = { content: editor.value, filename: currentFilename, needsExport: needsExport(), hasUserContent };
  try {
    try {
      localStorage.setItem('md-edit-draft', JSON.stringify({ ...draft, baseContent, pendingBase, boundFilename, loadedAt }));
    } catch(e) {
      // Out of quota: keep the draft itself; without the base it restores as a new document.
      localStorage.setItem('md-edit-draft', JSON.stringify(draft));
    }
    draftSaved = true;
  } catch(e) { draftSaved = false; }
  if (!draftSaved) { draftStatus.textContent = '無法保存瀏覽器草稿 · 請匯出 .md'; return; }
  const loaded = baseContent !== null && loadedAt ? ` · 原檔載入於 ${formatLoadedAt(loadedAt)}` : '';
  const pending = !needsExport() ? ''
    : fileHandle ? ' · 尚未儲存'
    : hasFsApi && baseContent !== null ? ' · 儲存前需重新選取原檔'
    : hasFsApi ? ' · 尚未儲存' : ' · 待匯出 .md';
  draftStatus.textContent = (fileHandle ? '已連結原檔' : '草稿已存於此瀏覽器') + loaded + pending;
}

function commitFilename() {
  currentFilename = normalizeFilename(filenameInput.value);
  filenameInput.value = currentFilename;
  persistDraft();
}

filenameInput.addEventListener('change', commitFilename);
filenameInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); commitFilename(); filenameInput.blur(); }
});

function closeMore() { document.getElementById('moreMenu').open = false; }
document.addEventListener('click', e => {
  if (!e.target.closest('#moreMenu')) closeMore();
});

// ── Sample content ──
editor.value = `# Markdown Editor ✨

\`\`\`mermaid

    S120 --> S130{是否包含特殊區塊}
    S130 -->|是| S140[S140 渲染 Mermaid / 表格]

// ── Render ──
let renderGeneration = 0; // tracks render epochs to discard stale async results

function render() {
  renderGeneration++;
  preview.innerHTML = currentView === 'notes'
    ? renderLifelogPreview(editor.value) ?? '<div class="lifelog-summary">未找到日期記錄，以下顯示原文預覽。</div>' + parseMd(editor.value)
    : parseMd(editor.value);
  preview.querySelectorAll('table').forEach(table => {
    const wrapper = document.createElement('div');
    wrapper.className = 'table-scroll';
    table.replaceWith(wrapper);
    wrapper.appendChild(table);
  });
  updateStats();
  if (searchBar.classList.contains('show') && searchInput.value) highlightPreview();
  persistDraft();
  // Debounced mermaid render — only when preview is visible, longer delay to
  // avoid rendering while the user is still typing invalid syntax
  if (mermaidReady && currentView !== 'edit') {
    clearTimeout(mermaidTimer);
    mermaidTimer = setTimeout(renderMermaid, 1200);
  }
}

async function renderMermaid() {
  // Capture generation at the start; if render() fires again before we finish
  // we'll know our results are stale and should be discarded.
  const gen = renderGeneration;

  const blocks = preview.querySelectorAll('code.language-mermaid');
  if (!blocks.length) return;

  for (let i = 0; i < blocks.length; i++) {
    // Abort if a newer render cycle has started
    if (renderGeneration !== gen) return;

    const codeEl = blocks[i];
    const pre = codeEl.parentElement; // <pre> wrapping the <code>
    if (!pre || !pre.isConnected) continue; // guard: already replaced by earlier cycle

    const src = codeEl.textContent.trim();
    if (!src) continue;

    // ── Cache hit: skip parse + render entirely ──
    if (mermaidCache.has(src)) {
      const div = document.createElement('div');
      div.className = 'mermaid-rendered';
      div.innerHTML = mermaidCache.get(src);
      pre.replaceWith(div);
      continue;
    }

    // Validate first with mermaid.parse() to avoid generating a giant error SVG
    let parseOk = false;
    try {
      await mermaid.parse(src);
      parseOk = true;
    } catch(_) { /* invalid syntax */ }

    // Guard again after the async parse
    if (renderGeneration !== gen) return;
    if (!pre.isConnected) continue;

    if (parseOk) {
      try {
        const id = 'mmd-' + gen + '-' + i;
        const { svg } = await mermaid.render(id, src);
        if (renderGeneration !== gen) return; // discard stale result
        if (!pre.isConnected) continue;
        mermaidCache.set(src, svg); // ── store in cache ──
        const div = document.createElement('div');
        div.className = 'mermaid-rendered';
        div.innerHTML = svg;
        pre.replaceWith(div);
      } catch(e) {
        if (renderGeneration !== gen) return;
        if (!pre.isConnected) continue;
        const errDiv = document.createElement('div');
        errDiv.className = 'mermaid-error';
        errDiv.textContent = '⚠ Mermaid 語法錯誤：' + (e.message || '').toString().substring(0, 120);
        pre.replaceWith(errDiv);
      }
    } else {
      // Show a compact inline error — never let mermaid produce the huge bomb SVG
      const errDiv = document.createElement('div');
      errDiv.className = 'mermaid-error';
      errDiv.textContent = '⚠ Mermaid 語法錯誤：請檢查流程圖語法';
      pre.replaceWith(errDiv);
    }
  }
}

function updateStats() {
  const t = editor.value;
  const stripped = t.replace(/[#*`~\[\]()>|\-]/g,'').trim();
  const cjk = (stripped.match(/[\u4e00-\u9fff\u3400-\u4dbf]/g)||[]).length;
  const eng = stripped.split(/\s+/).filter(w => w && !/[\u4e00-\u9fff]/.test(w)).length;
  const lines = t.split('\n').length;
  statsEl.textContent = `${t.length} 字元 · ${cjk+eng} 詞 · ${lines} 行`;
}

// ── View switching ──
function isReadingView(v = currentView) { return v === 'preview' || v === 'notes'; }

function setView(v) {
  if (mobileLayout.matches && v === 'split') v = 'preview';
  const changesNotes = (v === 'notes') !== (currentView === 'notes');
  currentView = v;
  document.body.dataset.view = v;
  document.querySelectorAll('[data-view]').forEach(b => {
    b.classList.toggle('active', b.dataset.view === v);
    b.setAttribute('aria-pressed', String(b.dataset.view === v));
  });
  editorPane.classList.toggle('hidden', isReadingView(v));
  editorPane.classList.toggle('full', v === 'edit');
  preview.classList.toggle('hidden', v === 'edit');
  editorPane.style.borderRight = v === 'split' ? '1px solid var(--border)' : 'none';
  if (isReadingView(v)) editor.blur();
  if (changesNotes) render();
  if (searchBar.classList.contains('show')) doSearch();
  // When switching to a view that shows the preview, render mermaid blocks immediately
  if (v !== 'edit' && mermaidReady) {
    clearTimeout(mermaidTimer);
    mermaidTimer = setTimeout(renderMermaid, 400);
  }
}
mobileLayout.addEventListener('change', () => {
  if (mobileLayout.matches && currentView === 'split') setView('preview');
});

// ── Theme ──
function toggleTheme() {
  isDark = !isDark;
  document.body.classList.toggle('dark', isDark);
  document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
  if (mermaidReady) {
    mermaid.initialize({ startOnLoad: false, theme: isDark ? 'dark' : 'default', securityLevel: 'loose', fontFamily: "'Noto Sans TC', sans-serif" });
    mermaidCache.clear(); // theme change invalidates all cached SVGs
  }
  try { localStorage.setItem('md-edit-dark', isDark ? '1' : '0'); } catch(e) {}
  render();
}

// ── No-OL toggle ──
function toggleNoOl() {
  noOl = !noOl;
  document.getElementById('noOlBtn').classList.toggle('toggle-on', noOl);
  try { localStorage.setItem('md-edit-no-ol', noOl ? '1' : '0'); } catch(e) {}
  render();
  showToast(noOl ? '已停用數字列表（專利模式）' : '已啟用數字列表');
}

// ── Search / Replace ──
const searchBar = document.getElementById('searchBar');
const searchInput = document.getElementById('searchInput');
const replaceInput = document.getElementById('replaceInput');
const searchInfo = document.getElementById('searchInfo');
let sCase = false, sRegex = false, sMatches = [], sIdx = -1, previewMatchIdx = 0;

function toggleSearch(withReplace) {
  if (withReplace && isReadingView()) setView('edit');
  const visible = searchBar.classList.contains('show');
  const replaceRow = document.getElementById('replaceRow');
  if (!visible) {
    searchBar.classList.add('show');
    replaceRow.classList.toggle('s-hidden', !withReplace);
    // Pre-fill with selection
    const sel = editor.value.substring(editor.selectionStart, editor.selectionEnd);
    if (sel && sel.length < 200 && !sel.includes('\n')) searchInput.value = sel;
    searchInput.focus();
    searchInput.select();
    doSearch();
  } else {
    // If already open, toggle replace row visibility or just re-focus
    if (withReplace) replaceRow.classList.remove('s-hidden');
    searchInput.focus();
    searchInput.select();
  }
}

function closeSearch() {
  searchBar.classList.remove('show');
  sMatches = []; sIdx = -1;
  searchInfo.textContent = '';
  clearPreviewHighlights();
  if (!isReadingView()) editor.focus();
}

function toggleCase() { sCase = !sCase; document.getElementById('sCaseBtn').classList.toggle('on', sCase); doSearch(); }
function toggleRegex() { sRegex = !sRegex; document.getElementById('sRegexBtn').classList.toggle('on', sRegex); doSearch(); }

function doSearch() {
  const q = searchInput.value;
  sMatches = []; sIdx = -1;
  previewMatchIdx = 0;
  if (!q) { searchInfo.textContent = ''; clearPreviewHighlights(); return; }

  try {
    const flags = sCase ? 'g' : 'gi';
    const re = sRegex ? new RegExp(q, flags) : new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), flags);
    let m;
    while ((m = re.exec(editor.value)) !== null) {
      sMatches.push({ start: m.index, end: m.index + m[0].length });
      if (m[0].length === 0) re.lastIndex++; // prevent infinite loop on zero-width match
    }
  } catch(e) {
    searchInfo.textContent = '正規式錯誤';
    return;
  }

  // Notes show readable dates instead of source date codes; search what is visible.
  if (currentView === 'notes') { highlightPreview(); return; }

  if (sMatches.length === 0) {
    searchInfo.textContent = '0 筆';
    clearPreviewHighlights();
    return;
  }

  // Find nearest match from cursor
  const cursor = editor.selectionStart;
  sIdx = sMatches.findIndex(m => m.start >= cursor);
  if (sIdx === -1) sIdx = 0;
  highlightMatch(false);
  highlightPreview();
}

function highlightMatch(focusEditor = true) {
  if (sMatches.length === 0 || sIdx < 0) return;
  const m = sMatches[sIdx];
  searchInfo.textContent = `${sIdx + 1} / ${sMatches.length}`;

  // Scroll editor to show match area
  const linesBefore = editor.value.substring(0, m.start).split('\n').length;
  const totalLines = editor.value.split('\n').length;
  const targetScroll = Math.max(0,
    ((linesBefore - 1) / totalLines) * editor.scrollHeight - editor.clientHeight / 3
  );
  editor.scrollTop = targetScroll;

  // Only steal focus & select when navigating (▲▼ / Enter), not while typing in search
  if (focusEditor) {
    if (isReadingView()) {
      highlightPreviewMatch(true);
      return;
    }
    editor.focus({ preventScroll: true });
    requestAnimationFrame(() => {
      editor.setSelectionRange(m.start, m.end);
    });
  }
}

// ── Preview highlight ──
function clearPreviewHighlights() {
  preview.querySelectorAll('mark.search-hl, mark.search-hl-active').forEach(m => {
    m.replaceWith(document.createTextNode(m.textContent));
  });
  preview.normalize();
}

function highlightPreview() {
  clearPreviewHighlights();
  const q = searchInput.value;
  if (!q) return;

  let re;
  try {
    const flags = sCase ? 'g' : 'gi';
    re = sRegex ? new RegExp(q, flags) : new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), flags);
  } catch(e) { return; }

  // Walk all text nodes in preview
  const walker = document.createTreeWalker(preview, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);

  nodes.forEach(node => {
    // Skip pre/code blocks
    if (node.parentElement && node.parentElement.closest('pre')) return;
    const text = node.textContent;
    re.lastIndex = 0;
    if (!re.test(text)) return;
    re.lastIndex = 0;

    const frag = document.createDocumentFragment();
    let last = 0, match;
    while ((match = re.exec(text)) !== null) {
      if (match.index > last) frag.appendChild(document.createTextNode(text.substring(last, match.index)));
      const mark = document.createElement('mark');
      mark.className = 'search-hl';
      mark.textContent = match[0];
      frag.appendChild(mark);
      last = re.lastIndex;
      if (match[0].length === 0) re.lastIndex++;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.substring(last)));
    node.replaceWith(frag);
  });
  if (isReadingView()) highlightPreviewMatch(false);
}

function highlightPreviewMatch(scroll) {
  const matches = preview.querySelectorAll('mark.search-hl');
  if (!matches.length) { searchInfo.textContent = '預覽 0 筆'; return; }
  previewMatchIdx = (previewMatchIdx + matches.length) % matches.length;
  matches.forEach(mark => mark.classList.remove('search-hl-active'));
  const active = matches[previewMatchIdx];
  active.classList.add('search-hl-active');
  searchInfo.textContent = `${previewMatchIdx + 1} / ${matches.length}`;
  if (scroll) active.scrollIntoView({ block: 'center' });
}

function searchNext() {
  if (isReadingView()) { previewMatchIdx++; highlightPreviewMatch(true); return; }
  if (sMatches.length === 0) { doSearch(); return; }
  sIdx = (sIdx + 1) % sMatches.length;
  highlightMatch();
}

function searchPrev() {
  if (isReadingView()) { previewMatchIdx--; highlightPreviewMatch(true); return; }
  if (sMatches.length === 0) { doSearch(); return; }
  sIdx = (sIdx - 1 + sMatches.length) % sMatches.length;
  highlightMatch();
}

function replaceCurrent() {
  if (sMatches.length === 0 || sIdx < 0) return;
  const m = sMatches[sIdx];
  const r = replaceInput.value;
  editor.value = editor.value.substring(0, m.start) + r + editor.value.substring(m.end);
  // Adjust cursor
  editor.selectionStart = editor.selectionEnd = m.start + r.length;
  hasUserContent = true;
  render();
  doSearch();
  if (sMatches.length > 0) {
    // Stay at same index or wrap
    if (sIdx >= sMatches.length) sIdx = 0;
    highlightMatch();
  }
}

function replaceAll() {
  const q = searchInput.value;
  const r = replaceInput.value;
  if (!q) return;
  try {
    const flags = sCase ? 'g' : 'gi';
    const re = sRegex ? new RegExp(q, flags) : new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), flags);
    const count = (editor.value.match(re) || []).length;
    editor.value = editor.value.replace(re, r);
    if (count) hasUserContent = true;
    render();
    doSearch();
    showToast(`已取代 ${count} 筆`);
  } catch(e) {
    showToast('正規式錯誤');
  }
}

// Live search on input
searchInput.addEventListener('input', doSearch);

// Search bar keyboard
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeSearch(); e.preventDefault(); }
  if (e.key === 'Enter' && !e.shiftKey) { searchNext(); e.preventDefault(); }
  if (e.key === 'Enter' && e.shiftKey) { searchPrev(); e.preventDefault(); }
});
replaceInput.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeSearch(); e.preventDefault(); }
  if (e.key === 'Enter') { replaceCurrent(); e.preventDefault(); }
});

// ── Insert markdown ──
function ins(prefix, suffix) {
  if (isReadingView()) setView('edit');
  const s = editor.selectionStart, e = editor.selectionEnd;
  const sel = editor.value.substring(s, e) || '文字';
  editor.value = editor.value.substring(0, s) + prefix + sel + suffix + editor.value.substring(e);
  editor.focus();
  editor.selectionStart = s + prefix.length;
  editor.selectionEnd = s + prefix.length + sel.length;
  hasUserContent = true;
  render();
}

// ── Keyboard shortcuts (editor) ──
editor.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey) {
    if (e.key === 'b') { e.preventDefault(); ins('**','**'); }
    if (e.key === 'i') { e.preventDefault(); ins('*','*'); }
    if (e.key === 'k') { e.preventDefault(); ins('[','](url)'); }
    if (e.key === 's') { e.preventDefault(); saveBack(); }
    if (e.key === 'o') { e.preventDefault(); openFile(); }
  }
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = editor.selectionStart;
    editor.value = editor.value.substring(0,s) + '  ' + editor.value.substring(editor.selectionEnd);
    editor.selectionStart = editor.selectionEnd = s + 2;
    hasUserContent = true;
    render();
  }
  if (e.key === 'F3' && !e.ctrlKey) { e.preventDefault(); e.shiftKey ? searchPrev() : searchNext(); }
});

// ── Global shortcuts (Ctrl+F / Ctrl+H / F3 / Esc) ──
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
    e.preventDefault();
    toggleSearch(false);
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'h') {
    e.preventDefault();
    toggleSearch(true);
  }
  if (e.key === 'Escape' && searchBar.classList.contains('show')) {
    closeSearch();
  }
  if (e.key === 'Escape') closeMore();
  if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'o') && e.target !== editor) {
    e.preventDefault();
    e.key === 's' ? saveBack() : openFile();
  }
  // F3 works globally (search box, replace box, editor, anywhere)
  if (e.key === 'F3' && !e.ctrlKey && !e.metaKey) {
    e.preventDefault();
    if (searchBar.classList.contains('show')) {
      e.shiftKey ? searchPrev() : searchNext();
    }
  }
});

// ── Sync scroll ──
editor.addEventListener('scroll', () => {
  if (currentView !== 'split') return;
  const ratio = editor.scrollTop / (editor.scrollHeight - editor.clientHeight || 1);
  preview.scrollTop = ratio * (preview.scrollHeight - preview.clientHeight);
});

// ── New file ──
function newFile() {
  if (saving || !canReplaceDocument()) return;
  fileLoadGeneration++;
  editor.value = '';
  currentFilename = 'document.md';
  filenameInput.value = currentFilename;
  exportedContent = null;
  exportedFilename = null;
  hasUserContent = false;
  fileHandle = baseContent = pendingBase = boundFilename = loadedAt = null;
  closeMore();
  setView('edit');
  render();
  editor.focus();
  showToast('已開新文件');
}

// ── Open file ──
function openFile() {
  if (saving) return;
  if (!hasFsApi) { document.getElementById('fileInput').click(); return; }
  window.showOpenFilePicker({ id: 'md-edit' })
    .then(async ([handle]) => {
      if (!isTextFile(handle.name)) { showToast('僅支援 Markdown / TXT'); return; }
      loadFile(await handle.getFile(), handle);
    })
    .catch(e => { if (e.name !== 'AbortError') showToast('檔案讀取失敗'); });
}

function canReplaceDocument() {
  return !hasUserContent || !needsExport()
    || confirm('目前內容尚未匯出，載入其他文件會取代此瀏覽器草稿。確定繼續？');
}

function loadFile(file, handle = null) {
  if (saving || !canReplaceDocument()) return;
  const generation = ++fileLoadGeneration;
  file.text().then(text => {
    if (generation !== fileLoadGeneration) return;
    editor.value = text;
    currentFilename = normalizeFilename(file.name);
    filenameInput.value = currentFilename;
    exportedContent = editor.value;
    exportedFilename = currentFilename;
    hasUserContent = true;
    fileHandle = handle;
    baseContent = text;
    pendingBase = null;
    boundFilename = currentFilename;
    loadedAt = Date.now();
    editor.scrollTop = preview.scrollTop = 0;
    render();
    if (mobileLayout.matches) setView('preview');
    showToast(`已開啟 ${file.name}`);
  }, () => showToast('檔案讀取失敗'));
}

const fileInput = document.getElementById('fileInput');
fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  loadFile(file);
  fileInput.value = '';
});

// ── Export ──
// Clean up &#46; entities injected by escapeOrderedList() so exported HTML has real dots
function cleanExport(html) { return html.replace(/&#46;/g, '.'); }

function downloadMd() {
  commitFilename();
  showMerged(withFinalNewline(editor.value));
  dl(editor.value, currentFilename, 'text/markdown;charset=utf-8');
  exportedContent = editor.value;
  exportedFilename = currentFilename;
  if (baseContent !== null) pendingBase = editor.value;
  render();
  showToast('已準備下載副本；原始檔案需自行替換');
}

// ── Save back ──
// The lifelog bot only appends to the month file. If the original grew while this
// document was open, the new tail is kept after the edited text; any other change
// to the original stops the save.
// A month file must end with a newline, or the bot's next record joins the last line.
function withFinalNewline(text) {
  return text && !text.endsWith('\n') && parseLifelog(text) ? text + '\n' : text;
}

function mergeAppended(base, disk, edited) {
  if (!disk.startsWith(base)) return { error: '原檔在載入後有刪改或截斷' };
  let tail = disk.slice(base.length);
  if (base && !base.endsWith('\n')) tail = tail.replace(/^\r?\n/, '');
  const lines = tail ? tail.split('\n').map(line => line.replace(/\r$/, '')) : [];
  // The bot writes a record line, then continuation lines indented by two spaces. Anything else
  // (such as a record line with a malformed time) means the tail is not a clean append.
  const entries = lines.map(line => line.match(LIFELOG_ENTRY_RE));
  const clean = tail.endsWith('\n') && entries[0] && lines.slice(0, -1).every((line, i) =>
    entries[i] ? lifelogDate(entries[i][1]) && lifelogTime(entries[i][2], entries[i][3]) : line.startsWith('  '));
  if (tail && !clean) return { error: '原檔新增的內容不是完整的 lifelog 記錄' };
  const head = tail && edited && !edited.endsWith('\n') ? edited + '\n' : withFinalNewline(edited);
  return { content: head + tail, added: entries.filter(Boolean).length };
}

// Matching content alone does not prove the re-selected file is the original.
function isBoundFile(name) {
  // normalizeFilename() turns `x.html` into `x.md`, so the extension is checked first.
  if (isTextFile(name) && normalizeFilename(name) === boundFilename) return true;
  alert(`選取的檔案是「${name}」，與原檔「${boundFilename}」不同，已停止儲存。`);
  return false;
}

// Block edits while the file is read and written, so the saved text and the editor cannot drift apart.
function setSaving(on) {
  saving = on;
  if (on) fileLoadGeneration++;
  document.body.inert = on;
}

function mergeWithDisk(disk) {
  // A downloaded copy may or may not have replaced the original. Of the two texts, the longer
  // one the file still starts with is presumed to be on disk; the shorter would need the bot
  // to have appended exactly what the edit removed or added (timestamps are minute-precise).
  const base = [baseContent, pendingBase].filter(b => b !== null && disk.startsWith(b))
    .sort((a, b) => b.length - a.length)[0] ?? baseContent;
  const merged = mergeAppended(base, disk, editor.value);
  if (merged.error) {
    alert(`${merged.error}，已停止儲存，原檔未變更。\n\n請確認選取的是原檔，或重新開啟原檔後再修改；目前內容可用「更多 → 匯出副本 .md」另存。`);
    return null;
  }
  return merged;
}

function showMerged(content) {
  if (editor.value === content) return;
  const { selectionStart, selectionEnd, scrollTop } = editor;
  editor.value = content;
  editor.setSelectionRange(selectionStart, selectionEnd);
  editor.scrollTop = scrollTop;
}

function addedNote(added) { return added ? `，並保留 ${added} 筆新增記錄` : ''; }

async function writeHandle(handle, content) {
  const writable = await handle.createWritable();
  await writable.write(content);
  await writable.close();
}

async function saveBack() {
  if (saving) return;
  commitFilename();
  closeMore();
  if (!hasFsApi) {
    if (baseContent === null || currentFilename !== boundFilename) downloadMd();
    else { showToast(`請選取原檔 ${boundFilename} 以核對`); document.getElementById('verifyInput').click(); }
    return;
  }
  const hadFocus = document.activeElement === editor;
  setSaving(true);
  try {
    if (baseContent === null || currentFilename !== boundFilename) {
      const handle = await window.showSaveFilePicker({ id: 'md-edit', suggestedName: currentFilename, types: PICKER_TYPES });
      showMerged(withFinalNewline(editor.value));
      await writeHandle(handle, editor.value);
      fileHandle = handle;
      currentFilename = boundFilename = normalizeFilename(handle.name);
      filenameInput.value = currentFilename;
      baseContent = editor.value;
      showToast(`已儲存 ${handle.name}`);
    } else {
      let handle = fileHandle;
      if (!handle) {
        showToast(`請選取原檔 ${boundFilename} 以核對`);
        [handle] = await window.showOpenFilePicker({ id: 'md-edit' });
        if (!isBoundFile(handle.name)) return;
      }
      const disk = await (await handle.getFile()).text();
      const merged = mergeWithDisk(disk);
      if (!merged) return;
      fileHandle = handle;
      if (merged.content !== disk) {
        // Asking for write access needs a fresh user gesture, which the picker may have used up.
        let granted = false;
        try { granted = await handle.requestPermission({ mode: 'readwrite' }) === 'granted'; } catch(e) {}
        if (!granted) { persistDraft(); showToast('尚未取得寫入權限；請再按一次儲存'); return; }
        await writeHandle(handle, merged.content);
      }
      showMerged(merged.content);
      baseContent = merged.content;
      showToast(`已存回 ${handle.name}` + addedNote(merged.added));
    }
    pendingBase = null;
    loadedAt = Date.now();
    exportedContent = editor.value;
    exportedFilename = currentFilename;
    hasUserContent = true;
    render();
  } catch(e) {
    if (e.name !== 'AbortError') alert(`儲存失敗：${e.message}`);
  } finally {
    setSaving(false);
    if (hadFocus) editor.focus();
  }
}

// Without the File System Access API: check against the re-selected original, then download the merged copy.
document.getElementById('verifyInput').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file || saving || !isBoundFile(file.name)) return;
  let disk;
  setSaving(true);
  try { disk = await file.text(); } catch(err) { showToast('檔案讀取失敗'); return; } finally { setSaving(false); }
  const merged = mergeWithDisk(disk);
  if (!merged) return;
  showMerged(merged.content);
  dl(merged.content, currentFilename, 'text/markdown;charset=utf-8');
  // The editor now holds everything on disk, whether or not the copy replaces the original.
  baseContent = disk;
  pendingBase = merged.content;
  exportedContent = editor.value;
  exportedFilename = currentFilename;
  render();
  showToast(`已核對原檔${addedNote(merged.added)}；請用下載的副本替換原檔`);
});
function downloadHtml() {
  commitFilename();
  const body = cleanExport(parseMd(editor.value));
  const full = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Markdown Export</title>
<style>body{font-family:-apple-system,'Noto Sans TC',sans-serif;max-width:800px;margin:40px auto;padding:0 20px;line-height:1.8;color:#1a1a2e}
pre{background:#f4f4f8;padding:16px;border-radius:8px;overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:13px}
pre code{background:none;padding:0;border:none}
code{background:#f4f4f8;padding:2px 6px;border-radius:4px;font-size:.9em}
table{border-collapse:collapse;width:100%}th,td{border:1px solid #ddd;padding:8px 12px;text-align:left}th{background:#f8f8fc}
blockquote{border-left:4px solid #5b5fc7;margin:0;padding:8px 16px;background:#f8f8fc}
a{color:#5b5fc7}</style></head><body>${body}</body></html>`;
  dl(full, currentFilename.replace(/\.md$/i, '.html'), 'text/html;charset=utf-8');
  showToast('已準備下載 HTML 副本');
}
function copyHtml() {
  if (!navigator.clipboard) { showToast('此瀏覽器無法複製，請匯出 HTML'); return; }
  navigator.clipboard.writeText(cleanExport(parseMd(editor.value)))
    .then(() => showToast('HTML 已複製！'))
    .catch(() => showToast('複製失敗，請匯出 HTML'));
}
function dl(content, name, type) {
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function showToast(msg) {
  const d = document.createElement('div');
  d.textContent = msg;
  Object.assign(d.style, {
    position:'fixed',bottom:'20px',left:'50%',transform:'translateX(-50%)',
    padding:'8px 20px',borderRadius:'8px',fontSize:'13px',fontWeight:'500',
    maxWidth:'calc(100vw - 32px)',width:'max-content',textAlign:'center',
    background:'var(--accent)',color:'#fff',zIndex:'999',
    animation:'fadeInUp .3s ease',boxShadow:'0 4px 16px rgba(0,0,0,.15)'
  });
  document.body.appendChild(d);
  setTimeout(() => { d.style.opacity = '0'; d.style.transition = 'opacity .3s'; setTimeout(() => d.remove(), 300); }, 1800);
}

// ── Drag & drop .md file ──
const overlay = document.getElementById('dropOverlay');
let dragCounter = 0;

['dragenter', 'dragover'].forEach(evt => {
  document.addEventListener(evt, e => {
    e.preventDefault(); e.stopPropagation();
    dragCounter++;
    overlay.classList.add('show');
  });
});

document.addEventListener('dragleave', e => {
  e.preventDefault(); e.stopPropagation();
  dragCounter--;
  if (dragCounter <= 0) { overlay.classList.remove('show'); dragCounter = 0; }
});

document.addEventListener('drop', e => {
  e.preventDefault(); e.stopPropagation();
  dragCounter = 0; overlay.classList.remove('show');
  const file = e.dataTransfer.files[0];
  if (!file) return;
  if (!isTextFile(file.name)) { showToast('僅支援 Markdown / TXT'); return; }
  // The handle must be requested inside the drop event.
  const item = e.dataTransfer.items && e.dataTransfer.items[0];
  if (hasFsApi && item && item.getAsFileSystemHandle) {
    item.getAsFileSystemHandle().then(
      handle => loadFile(file, handle && handle.kind === 'file' ? handle : null),
      () => loadFile(file));
  } else loadFile(file);
});

// ── Init ──
(function init() {
  try {
    const storedDraft = localStorage.getItem('md-edit-draft');
    const saved = storedDraft ? JSON.parse(storedDraft) : null;
    if (saved && typeof saved.content === 'string') {
      editor.value = saved.content;
      currentFilename = normalizeFilename(typeof saved.filename === 'string' ? saved.filename : 'document.md');
      hasUserContent = saved.hasUserContent !== false;
      if (saved.needsExport === false) {
        exportedContent = editor.value;
        exportedFilename = currentFilename;
      }
      if (typeof saved.baseContent === 'string') {
        baseContent = saved.baseContent;
        pendingBase = typeof saved.pendingBase === 'string' ? saved.pendingBase : null;
        boundFilename = typeof saved.boundFilename === 'string' ? saved.boundFilename : currentFilename;
        loadedAt = typeof saved.loadedAt === 'number' ? saved.loadedAt : null;
      }
    } else {
      const legacy = localStorage.getItem('md-edit-content');
      if (legacy !== null) { editor.value = legacy; hasUserContent = true; }
    }
    const savedNoOl = localStorage.getItem('md-edit-no-ol');
    if (savedNoOl !== null) noOl = savedNoOl === '1';
    isDark = localStorage.getItem('md-edit-dark') === '1';
  } catch(e) {}
  filenameInput.value = currentFilename;
  if (hasFsApi) {
    document.getElementById('saveBtn').textContent = '💾 儲存';
    document.getElementById('saveHint').textContent = '草稿只保存在此瀏覽器。儲存會直接寫回原檔，並保留原檔在開啟後新增的 lifelog 記錄；重新開啟頁面後需重新選取原檔。';
  } else {
    document.getElementById('saveHint').textContent = '草稿只保存在此瀏覽器。匯出前會請你重新選取原檔核對，再下載副本，原始檔案需自行替換。';
  }
  // Use the existing theme handler after loading the document and settings.
  if (isDark) { isDark = false; toggleTheme(); }
  document.getElementById('noOlBtn').classList.toggle('toggle-on', noOl);
  editor.addEventListener('input', () => { hasUserContent = true; render(); if (searchBar.classList.contains('show')) doSearch(); });
  setView(currentView);
  render();
})();
</script>

@keyframes fadeInUp {
  from { opacity: 0; transform: translateX(-50%) translateY(10px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
